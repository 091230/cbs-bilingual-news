<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CBS Bilingual News · 英语新闻精听</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='4' fill='%23c9955e'/><path d='M9 7l8 5-8 5z' fill='%230e0d0b'/></svg>">
<!-- 自托管衬线展示字体（新闻权威感）+ 系统无衬线 UI -->
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<script>window.STATIC_SITE = true;</script>
<style>
  :root {
    --bg: #0e0d0b;
    --surface: #161412;
    --surface-2: #1c1916;
    --line: #2a2520;
    --line-bright: #3d362e;
    --text: #e8e2d8;
    --text-dim: #9a9084;
    --text-faint: #6b6258;
    --accent: #c9955e;
    --accent-bright: #e0b078;
    --accent-dim: #8a6a42;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  body {
    font-family: "Noto Sans SC", -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #3a342c; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #4d453a; }

  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

  /* ===== 刊头 ===== */
  header {
    border-bottom: 1px solid var(--line);
    padding: 48px 0 32px;
  }
  .masthead { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
  .kicker {
    font-size: 11px; letter-spacing: 0.25em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 14px; display: flex; align-items: center; gap: 8px;
  }
  .kicker .dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  h1 {
    font-family: "Newsreader", "Source Serif Pro", Georgia, serif;
    font-weight: 600; font-size: clamp(32px, 5vw, 52px);
    line-height: 1.05; letter-spacing: -0.01em; color: var(--text);
  }
  h1 em { font-style: italic; color: var(--accent-bright); }
  .subtitle { margin-top: 14px; color: var(--text-dim); font-size: 14px; max-width: 520px; }
  .stat {
    font-family: "Newsreader", Georgia, serif;
    font-size: 40px; font-weight: 500; color: var(--accent); line-height: 1;
  }
  .stat-label { font-size: 11px; color: var(--text-faint); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 6px; }

  /* ===== 期次网格 ===== */
  main { padding: 36px 0 64px; }
  .grid {
    display: grid; gap: 20px;
    grid-template-columns: 1fr;
  }
  @media (min-width: 640px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 1000px) { .grid { grid-template-columns: repeat(3, 1fr); } }

  .card {
    display: flex; flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--line);
    text-decoration: none; color: inherit;
    transition: border-color .2s, transform .15s;
    position: relative; overflow: hidden;
  }
  .card:hover { border-color: var(--accent-dim); }
  .card:active { transform: scale(.99); }
  .card-thumb {
    aspect-ratio: 16/9; background: var(--surface-2);
    display: flex; align-items: center; justify-content: center;
    border-bottom: 1px solid var(--line); position: relative;
    background-image: radial-gradient(circle at 30% 40%, #221e19, var(--surface-2) 70%);
  }
  .play-btn {
    width: 48px; height: 48px; border-radius: 50%;
    background: rgba(14,13,11,.7); border: 1px solid var(--line-bright);
    display: flex; align-items: center; justify-content: center;
    transition: background .2s, border-color .2s;
  }
  .card:hover .play-btn { background: var(--accent); border-color: var(--accent); }
  .play-btn svg { width: 16px; height: 16px; fill: var(--text); margin-left: 2px; }
  .card:hover .play-btn svg { fill: var(--bg); }
  .badge-date {
    position: absolute; top: 12px; left: 12px;
    font-size: 11px; font-weight: 500; color: var(--text);
    background: rgba(14,13,11,.8); padding: 3px 9px;
    border: 1px solid var(--line-bright); letter-spacing: 0.05em;
  }
  .badge-src {
    position: absolute; top: 12px; right: 12px;
    font-size: 10px; color: var(--accent-bright);
    background: rgba(14,13,11,.8); padding: 3px 8px;
    border: 1px solid rgba(201,149,94,.3); letter-spacing: 0.05em;
  }
  .badge-dur {
    position: absolute; bottom: 12px; left: 12px;
    font-size: 11px; color: var(--text-dim);
    background: rgba(14,13,11,.8); padding: 2px 7px;
    font-variant-numeric: tabular-nums;
  }
  .card-body { padding: 18px 20px 20px; flex: 1; display: flex; flex-direction: column; }
  .card-title {
    font-family: "Newsreader", Georgia, serif;
    font-size: 18px; font-weight: 600; line-height: 1.3; color: var(--text);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card:hover .card-title { color: var(--accent-bright); }
  .card-meta { margin-top: 10px; font-size: 12px; color: var(--text-faint); }

  /* ===== 空态 / 错误 ===== */
  .msg { text-align: center; padding: 80px 0; color: var(--text-dim); font-size: 14px; line-height: 1.8; }

  /* ===== 页脚 ===== */
  footer {
    border-top: 1px solid var(--line);
    padding: 20px 0; font-size: 12px; color: var(--text-faint);
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px;
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="masthead">
      <div>
        <div class="kicker"><span class="dot"></span>ON AIR · LIVE STREAM</div>
        <h1>CBS 双语<em>新闻精听</em></h1>
        <p class="subtitle">每日英语新闻 · 中英对照字幕 · 在线高清流 · 点任意一期开始跟读</p>
      </div>
      <div style="text-align:right">
        <div class="stat" id="stat-count">–</div>
        <div class="stat-label">已上线期数</div>
      </div>
    </div>
  </div>
</header>

<main class="wrap">
  <div id="grid" class="grid"></div>
  <div id="msg" class="msg" style="display:none"></div>
</main>

<footer class="wrap">
  <span>开源项目 · 内容来自 CBS News 公开节目 · 仅供英语学习</span>
  <span>字幕由 Claude 翻译</span>
</footer>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

const fmtDur = (s) => {
  if (!isFinite(s) || s <= 0) return '';
  const m = Math.floor(s / 60), x = Math.floor(s % 60);
  return `${m}:${String(x).padStart(2, '0')}`;
};

function showDate(ep) {
  if (ep.upload_date) return ep.upload_date.slice(0, 10);
  const m = /^(\d{2})(\d{2})(\d{2})-/.exec(ep.slug || '');
  return m ? `20${m[3]}-${m[1]}-${m[2]}` : '';
}

function card(ep) {
  const date = showDate(ep);
  const badge = date ? date.slice(5).replace('-', '/') : '—';
  const dur = fmtDur(ep.duration);
  const seg = ep.segment_count ? `${ep.segment_count} 句` : '';
  return `
    <a href="player.html?slug=${encodeURIComponent(ep.slug)}" class="card">
      <div class="card-thumb">
        <div class="play-btn"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
        <span class="badge-date">${esc(badge)}</span>
        ${ep.transcript_source === 'cbs-captions'
          ? '<span class="badge-src">官方字幕</span>' : ''}
        ${dur ? `<span class="badge-dur">${esc(dur)}</span>` : ''}
      </div>
      <div class="card-body">
        <div class="card-title">${esc(ep.title || ep.slug)}</div>
        <div class="card-meta">${[seg, '在线流'].filter(Boolean).join(' · ')}</div>
      </div>
    </a>`;
}

(async () => {
  try {
    const url = window.STATIC_SITE ? 'index.json' : '/api/episodes';
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const eps = data.episodes || [];
    $('stat-count').textContent = eps.length;
    if (!eps.length) {
      $('grid').innerHTML = '';
      $('msg').style.display = 'block';
      $('msg').innerHTML = '还没有任何一期内容。';
      return;
    }
    $('grid').innerHTML = eps.map(card).join('');
  } catch (err) {
    console.error(err);
    $('grid').innerHTML = '';
    $('msg').style.display = 'block';
    $('msg').innerHTML = '读取期次列表失败：' + esc(err.message);
  }
})();
</script>
</body>
</html>
